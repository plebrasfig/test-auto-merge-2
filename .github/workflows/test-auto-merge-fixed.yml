name: Test auto-merge (fixed condition)

# GRAPHQL-3135 / GRAPHQL-3251 : reproduit fig-actions/graphql/auto-merge en
# ajoutant dependency-group comme repli quand update-type est null, pour
# valider en conditions reelles que l'auto-merge se declenche desormais sur
# une PR de securite groupee.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: ./.github/actions/auto-merge-fixed
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
